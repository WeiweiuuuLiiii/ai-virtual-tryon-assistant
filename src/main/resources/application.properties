server.port=${PORT:8000}

# API keys — set in .env or environment
anthropic.api.key=${ANTHROPIC_API_KEY:}
openweather.api.key=${OPENWEATHER_API_KEY:}
replicate.api.token=${REPLICATE_API_TOKEN:}
fashn.api.key=${FASHN_API_KEY:}
wavespeed.api.key=${WAVESPEED_API_KEY:}
openai.api.key=${OPENAI_API_KEY:}
openai.image.model=${OPENAI_IMAGE_MODEL:gpt-image-2}
openai.image.quality=${OPENAI_IMAGE_QUALITY:high}
openai.image.size=${OPENAI_IMAGE_SIZE:1024x1024}
openai.image.output.format=${OPENAI_IMAGE_OUTPUT_FORMAT:jpeg}
openai.image.output.compression=${OPENAI_IMAGE_OUTPUT_COMPRESSION:92}
cloudinary.cloud.name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api.key=${CLOUDINARY_API_KEY:}
cloudinary.api.secret=${CLOUDINARY_API_SECRET:}
app.public-demo-mode=${PUBLIC_DEMO_MODE:false}
app.demo-codes=${DEMO_CODES:}
app.demo-code-max-uses=${DEMO_CODE_MAX_USES:10}
app.daily-generation-limit=${DAILY_GENERATION_LIMIT:50}

# Allow large photo uploads (up to 200 MB per request)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=200MB

# Serve index.html at /
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
